# Shared settings for every StayCloud service.
# Defaults target GCP project staycloud (hotel-vpc). Override with env for local Docker.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://10.10.0.13:8761/eureka,http://10.10.0.12:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
