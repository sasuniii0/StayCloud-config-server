server:
  port: ${SERVER_PORT:8080}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: room-service
              uri: lb://room-service
              predicates:
                - name: Path
                  args:
                    patterns: /api/rooms/**
            - id: reservation-service
              uri: lb://reservation-service
              predicates:
                - name: Path
                  args:
                    patterns: /api/reservations/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - name: Path
                  args:
                    patterns: /api/payments/**

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
