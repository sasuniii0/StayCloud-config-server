server:
  port: ${SERVER_PORT:8761}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: true
  client:
    # staycloud platform MIG: both Eureka VMs peer so every gateway sees all services
    register-with-eureka: ${EUREKA_PEER_MODE:true}
    fetch-registry: ${EUREKA_PEER_MODE:true}
    service-url:
      defaultZone: ${EUREKA_PEER_URLS:http://10.10.0.13:8761/eureka,http://10.10.0.12:8761/eureka}
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 5000
