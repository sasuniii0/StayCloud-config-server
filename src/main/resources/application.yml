server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo
        # To back this with a real Git repository instead, set:
        #   SPRING_PROFILES_ACTIVE=git
        #   CONFIG_REPO_URI=https://github.com/<you>/hotel-config-repo.git
        git:
          uri: ${CONFIG_REPO_URI:}
          default-label: main
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
  endpoint:
    health:
      show-details: always
